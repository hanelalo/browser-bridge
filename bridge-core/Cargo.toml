[package]
name = "bridge-core"
version = "0.1.0"
edition = "2021"
description = "Browser Bridge 客户端共享库：传输层、元素定位、站点配方"

[dependencies]
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = "0.24"
