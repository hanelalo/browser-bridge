[package]
name = "bridge-mcp"
version = "0.1.0"
edition = "2021"
description = "Browser Bridge MCP server：把浏览器指令暴露为 MCP tools（stdio）"

[dependencies]
bridge-core = { path = "../bridge-core" }
rmcp = { version = "3.1.0", features = ["schemars", "transport-io"] }
schemars = { version = "1.2", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
