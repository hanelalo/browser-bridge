[package]
name = "bridge-client"
version = "0.1.0"
edition = "2021"
description = "Browser Bridge CLI client"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = "0.24"
