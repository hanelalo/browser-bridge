[package]
name = "bridge-server"
version = "0.1.0"
edition = "2021"
description = "Browser Bridge WebSocket hub"

[dependencies]
bridge-mcp = { path = "../bridge-mcp" }
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }
rmcp = { version = "3.1.0", features = ["schemars", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
